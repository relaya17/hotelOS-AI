components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Authorization: Bearer accessToken from POST /v1/auth/login"

  parameters:
    hotelId:
      name: hotelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    hotelIdQuery:
      name: hotelId
      in: query
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Principal lacks scope for the resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, correlationId]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            correlationId: { type: string }

    DataEnvelope:
      type: object
      properties:
        data: {}

    HealthStatus:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, enum: [api] }
        version: { type: string }
        recordings:
          type: object
          properties:
            backend: { type: string }
            root: { type: string }

    HotelSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string }
        currency: { type: string }
        chainId: { type: string, format: uuid, nullable: true }
        kashrutEnabled: { type: boolean }

    UserProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        roles:
          type: array
          items: { type: string }
        scope:
          type: object
          properties:
            tenantId: { type: string, format: uuid }
            chainId: { type: string, format: uuid }
            hotelId: { type: string, format: uuid }
            departmentId: { type: string, format: uuid }

    AuthLoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user:
          $ref: "#/components/schemas/UserProfile"

    PublicStay:
      type: object
      properties:
        bookingId: { type: string, format: uuid }
        hotelId: { type: string, format: uuid }
        hotelName: { type: string }
        roomNumber: { type: string }
        guestName: { type: string }
        guestPhone: { type: string, nullable: true }
        checkInDate: { type: string }
        checkOutDate: { type: string }
        status: { type: string }
        roomPrepStatus: { type: string, nullable: true }
        roomStatus: { type: string, nullable: true }
        upsellOffers:
          type: array
          items: { type: object }
